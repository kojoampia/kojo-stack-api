spring:
  application:
    name: kojo-stack-api
    version: 2026.1.0

  # Cache Configuration
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 1 hour

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration (Health Checks, Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: kojo-stack-api
      environment: dev
    distribution:
      percentiles-histogram:
        http.server.requests: true
        profile.getAll: true
        profile.service.getAll: true
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests for development
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.kojo.stack: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    io.opentelemetry: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/kojo-stack-api.log
    max-size: 10MB
    max-history: 10

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# JWT Configuration
app:
  jwtSecret: ***REMOVED-JWT-SECRET***
  jwtExpirationMs: 86400000  # 24 hours in milliseconds
