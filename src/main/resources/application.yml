spring:
  application:
    name: kojo-stack-api
    version: 2026.1.0

  # Cache Configuration (Ehcache - In-Memory)
  cache:
    type: jcache
    jcache:
      config: classpath:ehcache.xml

  # Servlet Configuration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: always
    include-stacktrace: on_param
    include-exception: false

# Actuator Configuration (Health Checks, Metrics)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: kojo-stack-api
      environment: dev
    distribution:
      percentiles-histogram:
        http.server.requests: true
        profile.getAll: true
        profile.service.getAll: true
  tracing:
    sampling:
      probability: 1.0  # Sample 100% of requests for development
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

# Logging Configuration
logging:
  level:
    root: INFO
    com.kojo.stack: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    io.opentelemetry: DEBUG
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/kojo-stack-api.log
    max-size: 10MB
    max-history: 10

# OpenAPI/Swagger Documentation
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha

# JWT Configuration
# The signing key MUST come from the environment. There is deliberately no default:
# JwtTokenProvider refuses to start when it is missing or shorter than 32 bytes.
# The dev profile supplies a throwaway value; prod must set JWT_SECRET.
app:
  jwtSecret: ${JWT_SECRET:}
  jwtExpirationMs: ${JWT_EXPIRATION_MS:86400000}  # 24 hours in milliseconds
  mail:
    from: ${APP_MAIL_FROM:no-reply@kojo-stack.local}
    base-url: ${APP_MAIL_BASE_URL:http://localhost:4200}
  security:
    # Comma-separated CORS origins. Empty falls back to the localhost dev origins
    # in CorsConfig. Set CORS_ORIGINS in any deployed environment.
    cors-origins: ${CORS_ORIGINS:}
  # The single site administrator account, reconciled from the environment on every
  # start by AdminAccountInitializer. There is deliberately no default password:
  # the application refuses to start without ADMIN_PASSWORD. Changing ADMIN_PASSWORD
  # and restarting is the supported way to rotate the credential.
  admin:
    login: ${ADMIN_LOGIN:admin}
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    first-name: ${ADMIN_FIRST_NAME:Site}
    last-name: ${ADMIN_LAST_NAME:Administrator}
