spring:
  config:
    activate:
      on-profile: prod

  # MongoDB Configuration (Production - via Environment Variables)
  data:
    mongodb:
      uri: mongodb://${MONGODB_HOST:mongodb}:${MONGODB_PORT:27017}/${MONGODB_DATABASE:kojo-stack}?retryWrites=true&w=majority
      auto-index-creation: false

  # Mail Configuration (Production - SMTP via Environment Variables)
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # Kafka Configuration (Production - Broker Cluster)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
    producer:
      acks: all
      retries: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      compression-type: snappy
      batch-size: 16384
      linger-ms: 100
    consumer:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka-broker-1:9092,kafka-broker-2:9092,kafka-broker-3:9092}
      group-id: kojo-stack-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      max-poll-records: 500
      properties:
        spring.json.trusted.packages: "*"

# Production Logging (Minimal, Performance Focused)
logging:
  level:
    root: WARN
    com.kojo.stack: INFO
    org.springframework.web: WARN
    org.springframework.data.mongodb: WARN
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/kojo-stack-api/kojo-stack-api.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB

# Production Server Config
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 2048
  error:
    include-stacktrace: never
    include-message: on_param
    include-exception: false
  shutdown: graceful

# Production Actuator (Limited endpoints)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Application Properties
app:
  db:
    init-data: false
  security:
    enable-cors: true
    cors-origins: ${CORS_ORIGINS:}
