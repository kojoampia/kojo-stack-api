spring:
  config:
    activate:
      on-profile: dev

  # MongoDB Configuration (Local Development)
  data:
    mongodb:
      uri: mongodb://localhost:27017/kojo-stack
      auto-index-creation: true

  # Mail Configuration (Local Development - MailHog/Mailpit)
  mail:
    host: localhost
    port: 1025
    username:
    password:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false


# Development Logging (Verbose)
logging:
  level:
    root: INFO
    com.kojo.stack: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/kojo-stack-api.log
    max-size: 10MB
    max-history: 7

# Development Server Config
server:
  port: 8085
  error:
    include-stacktrace: always
    include-message: always

# Development Actuator (All endpoints exposed)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops

# Development Database Init
app:
  db:
    init-data: true
  # Throwaway local-only signing key so `spring-boot:run -Dspring-boot.run.profiles=dev`
  # works without extra setup. Never reused by prod, which has no default.
  jwtSecret: ${JWT_SECRET:dev-only-insecure-signing-key-do-not-deploy-0123456789}
  admin:
    # Local-only administrator credential. Prod has no default and refuses to start
    # without ADMIN_PASSWORD.
    login: ${ADMIN_LOGIN:admin}
    email: ${ADMIN_EMAIL:admin@kojo-stack.local}
    password: ${ADMIN_PASSWORD:dev-only-admin-password}
