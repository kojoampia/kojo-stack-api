spring:
  config:
    activate:
      on-profile: dev

  # MongoDB Configuration (Local Development)
  data:
    mongodb:
      uri: mongodb://localhost:27017/kojo-stack
      auto-index-creation: true

  # Kafka Configuration (Local Development)
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      bootstrap-servers: localhost:9092
      group-id: kojo-stack-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"

# Development Logging (Verbose)
logging:
  level:
    root: INFO
    com.kojo.stack: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.springframework.kafka: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/kojo-stack-api.log
    max-size: 10MB
    max-history: 7

# Development Server Config
server:
  port: 8080
  error:
    include-stacktrace: always
    include-message: always

# Development Actuator (All endpoints exposed)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops

# Development Database Init
app:
  db:
    init-data: true
