apiVersion: v1
kind: Namespace
metadata:
  name: kojo-stack

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: kojo-stack
data:
  application.yml: |
    spring:
      application:
        name: kojo-stack-api
      jpa:
        hibernate:
          ddl-auto: validate
      datasource:
        hikari:
          maximum-pool-size: 20
      redis:
        timeout: 2000ms
      kafka:
        consumer:
          group-id: kojo-stack-group

---
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: kojo-stack
type: Opaque
stringData:
  db-password: changeme123
  db-user: kojo
  redis-password: ""
  kafka-brokers: kafka:9092

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kojo-api
  namespace: kojo-stack
  labels:
    app: kojo-api
    version: 2026.1.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kojo-api
  template:
    metadata:
      labels:
        app: kojo-api
        version: 2026.1.0
    spec:
      serviceAccountName: kojo-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      containers:
      - name: kojo-api
        image: kojo-stack-api:2026.1.0
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVER_PORT
          value: "8080"
        - name: DB_HOST
          value: postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: kojo_stack
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: db-user
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: db-password
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: kafka-brokers
        - name: JAVA_OPTS
          value: "-Xmx512m -Xms256m -XX:+UseG1GC"
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: http
          initialDelaySeconds: 20
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: kojo-api
  namespace: kojo-stack
  labels:
    app: kojo-api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  selector:
    app: kojo-api

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kojo-api
  namespace: kojo-stack

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kojo-api-pdb
  namespace: kojo-stack
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: kojo-api

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: kojo-api-hpa
  namespace: kojo-stack
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kojo-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
