name: CI

# Mirrors the Jenkinsfile: run the suite, then build and publish the image.
# The Dockerfile builds with -DskipTests, so this workflow is the only place
# the tests actually execute before an image ships.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.jojoaddison.net
  IMAGE_NAME: kojo-stack-api

jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build targets release 21; a newer JDK cannot compile it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        run: ./mvnw -B clean test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package
        run: ./mvnw -B package -DskipTests

  publish:
    name: Build and push image
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check registry credentials
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USERNAME" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_USERNAME and REGISTRY_PASSWORD repository secrets are not set."
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Derive version tag
        id: version
        run: echo "value=$(date -u +%Y.%m).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo '`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.value }}`'
            echo ""
            echo "Also tagged \`sha-${{ github.sha }}\` and \`latest\`."
            echo ""
            echo "Reminder: this image refuses to start without JWT_SECRET and"
            echo "ADMIN_PASSWORD in the target environment."
          } >> "$GITHUB_STEP_SUMMARY"
