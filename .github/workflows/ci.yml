name: CI

# Build-and-test gate for pull requests and the default branch. Publishing the deployable
# image is a separate concern (.github/workflows/publish.yml) that runs only on main and tags.
#
# The Dockerfile builds with -DskipTests, so this is the only place the 61 tests execute.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  verify:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The build targets release 21; a newer JDK cannot compile it.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Test
        run: ./mvnw -B clean test

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      - name: Package
        run: ./mvnw -B package -DskipTests
