name: kojo-stack
services:
  # Spring Boot Backend API
  kojo-stack-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kojo-stack-api
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JWT_SECRET: 
    networks:
      - kojo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  kojo-network:
    driver: bridge
