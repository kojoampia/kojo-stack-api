name: kojo-stack
services:
  # MongoDB Database
  mongodb:
    image: mongo:7
    container_name: kojo-stack-mongodb
    environment:
      MONGO_INITDB_DATABASE: kojo-stack
    volumes:
      - mongodb-data:/data/db
      - ./dist/data.json:/docker-entrypoint-initdb.d/data.json:ro
      - ./dist/mongo-init.sh:/docker-entrypoint-initdb.d/mongo-init.sh:ro
    networks:
      - kojo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot Backend API
  kojo-stack-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kojo-stack-api
    ports:
      - "8085:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: kojo-stack
      MONGODB_USER: ""
      MONGODB_PASSWORD: ""
      JWT_SECRET: 
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - kojo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  mongodb-data:

networks:
  kojo-network:
    driver: bridge
